# Mantem o Gradle dentro da memoria disponivel no WSL e evita que o Linux
# encerre o VS Code quando a RAM/swap ficam cheias.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# A rede deste ambiente pode levar varios minutos para entregar artefatos
# grandes do Maven. Evita que uma transferencia valida seja descartada cedo.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000
org.gradle.workers.max=2
